<div class="signup-card">

    <h1>🚗 Join India's Biggest Used Car Family</h1>

    <p>
        More than <b>10,000+</b> verified cars waiting for you.
        Create your account and let our AI find your perfect car.
    </p>

    <form action="/buyer-register" method="POST">

        <input type="text" name="fullname" placeholder="👤 Full Name" required>

        <input type="email" name="email" placeholder="📧 Email Address" required>

        <input type="tel" name="phone" placeholder="📱 Mobile Number" required>

        <input type="text" name="city" placeholder="🏙 City">

        <hr>

        <select name="brand" required>
            <option>Select Your Favourite Brand</option>
            <option>BMW</option>
            <option>Audi</option>
            <option>Mercedes-Benz</option>
            <option>Tata</option>
            <option>Mahindra</option>
            <option>Hyundai</option>
            <option>Kia</option>
        </select>

        <input type="text" name="model" placeholder="🚘 Dream Model">

        <input type="number" name="budget" placeholder="💰 Budget">

        <select name="fuel">
            <option>Fuel Type</option>
            <option>Petrol</option>
            <option>Diesel</option>
            <option>Electric</option>
            <option>Hybrid</option>
        </select>

        <select name="transmission">
            <option>Transmission</option>
            <option>Automatic</option>
            <option>Manual</option>
        </select>

        <hr>

        <label><input type="checkbox"> Sunroof</label><br>
        <label><input type="checkbox"> Leather Seats</label><br>
        <label><input type="checkbox"> Automatic AC</label><br>
        <label><input type="checkbox"> Touchscreen</label><br>
        <label><input type="checkbox"> Reverse Camera</label><br>
        <label><input type="checkbox"> Bluetooth</label><br>

        <hr>

        <select name="colour">
            <option>Preferred Colour</option>
            <option>Black</option>
            <option>White</option>
            <option>Grey</option>
            <option>Blue</option>
            <option>Red</option>
        </select>

        <hr>

        <textarea
            rows="5"
            name="requirements"
            placeholder="📝 Tell us about your dream car...">
        </textarea>

        <br><br>

        <label>
            <input type="checkbox" required>
            I agree to the Terms & Conditions
        </label>

        <br><br>

        <button type="submit">
            🚀 FIND MY DREAM CAR
        </button>

    </form>

</div>
